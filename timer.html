<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wukong's Focus Timer 🍑</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            position: relative;
            text-align: center;
        }

        /* Top Controls */
        .controls-top {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-add {
            background: #fff8e1;
            border: 2px solid #ffd700;
            color: #d32f2f;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1rem;
        }

        .btn-add:active {
            transform: scale(0.95);
        }

        /* The Timer Circle */
        .timer-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        circle {
            fill: none;
            stroke-width: 15;
            stroke-linecap: round;
        }

        .bg-circle {
            stroke: #eee;
        }

        .progress-circle {
            stroke: #ffd700; /* Golden Fillet */
            stroke-dasharray: 880; /* 2 * PI * 140 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        /* Play Button (Center) */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: #d32f2f;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            z-index: 10;
        }

        .play-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px; /* Visual centering */
        }

        .pause-icon {
            width: 20px;
            height: 30px;
            border-left: 8px solid white;
            border-right: 8px solid white;
            display: none;
        }

        /* Time Display */
        .time-display {
            font-size: 4rem;
            font-weight: bold;
            color: #d32f2f;
            margin-top: 20px;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .status-text {
            color: #795548;
            margin-top: 10px;
            font-style: italic;
            min-height: 1.5em;
        }

        /* Cloud Decorations */
        .cloud {
            position: absolute;
            font-size: 3rem;
            opacity: 0.5;
            z-index: -1;
            animation: float 6s infinite ease-in-out;
        }
        .c1 { top: 10%; left: 10%; animation-delay: 0s; }
        .c2 { bottom: 10%; right: 10%; animation-delay: 2s; }
        .c3 { top: 20%; right: 20%; animation-delay: 4s; font-size: 2rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .back-link {
            margin-top: 30px;
            text-decoration: none;
            color: #555;
            font-weight: bold;
            display: inline-block;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="cloud c1">☁️</div>
    <div class="cloud c2">☁️</div>
    <div class="cloud c3">☁️</div>

    <div class="container">
        <div class="controls-top">
            <button class="btn-add" onclick="addMinutes(1)">+1m</button>
            <button class="btn-add" onclick="addMinutes(5)">+5m</button>
        </div>

        <div class="timer-wrapper">
            <svg>
                <circle class="bg-circle" cx="150" cy="150" r="140"></circle>
                <circle class="progress-circle" cx="150" cy="150" r="140"></circle>
            </svg>
            <button class="play-btn" id="toggleBtn">
                <div class="play-icon" id="icon-play"></div>
                <div class="pause-icon" id="icon-pause"></div>
            </button>
        </div>

        <div class="time-display" id="time-text">05:00</div>
        <div class="status-text" id="status-text">Ready?</div>

        <br>
        <a href="index.html" class="back-link">← Back to Shrine</a>
    </div>

    <script>
        // Audio Context for Gong
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playGong() {
            if (!audioCtx) initAudio();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5); // Deep drop
            
            // Gong envelope
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 3);

            // Add harmonics for metallic sound
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc2.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 2);
            gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
            
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 2);
        }

        // Timer Logic
        let duration = 5 * 60; // Seconds
        let endTime = 0;
        let isRunning = false;
        let animationFrameId;
        const defaultStart = 5 * 60;

        const circle = document.querySelector('.progress-circle');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = 0;

        // Preload audio on user interaction
        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });

        function updateDisplay(seconds) {
            if (seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            document.getElementById('time-text').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            
            // Progress bar
            // If running, base it on total duration of this session?
            // Or just visual feedback. Let's make it fill -> empty based on CURRENT duration setting.
            // If we add time, we need a reference total.
            // Simplified: Percentage of current target.
            
            let total = isRunning ? (endTime - (Date.now() - (seconds * 1000))) / 1000 : duration;
            // Actually, simplified approach:
            // Just assume the 'duration' variable is the capacity.
            
            const percent = seconds / duration; 
            // Cap at 1
            const p = Math.min(1, Math.max(0, percent));
            const offset = circumference - p * circumference;
            circle.style.strokeDashoffset = offset;
        }

        function addMinutes(mins) {
            const addSecs = mins * 60;
            if (isRunning) {
                // Extend the end time
                endTime += addSecs * 1000;
                duration += addSecs; // Expand scale
                updateTimer();
            } else {
                duration += addSecs;
                updateDisplay(duration);
            }
        }

        document.getElementById('toggleBtn').addEventListener('click', toggleTimer);

        function toggleTimer() {
            initAudio(); // Ensure audio context is ready
            
            if (isRunning) {
                pause();
            } else {
                start();
            }
        }

        function start() {
            if (duration <= 0) duration = defaultStart;
            
            endTime = Date.now() + duration * 1000;
            isRunning = true;
            
            document.getElementById('icon-play').style.display = 'none';
            document.getElementById('icon-pause').style.display = 'block';
            document.getElementById('status-text').innerText = "Focus...";
            
            tick();
        }

        function pause() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            
            // Save remaining time
            const now = Date.now();
            const remaining = Math.ceil((endTime - now) / 1000);
            duration = remaining > 0 ? remaining : 0;
            
            document.getElementById('icon-play').style.display = 'block';
            document.getElementById('icon-pause').style.display = 'none';
            document.getElementById('status-text').innerText = "Paused";
        }

        function tick() {
            if (!isRunning) return;

            const now = Date.now();
            const remaining = endTime - now;

            if (remaining <= 0) {
                // Done
                finish();
            } else {
                updateDisplay(remaining / 1000);
                animationFrameId = requestAnimationFrame(tick);
            }
        }
        
        function updateTimer() {
             const now = Date.now();
             const remaining = endTime - now;
             updateDisplay(remaining / 1000);
        }

        function finish() {
            isRunning = false;
            duration = 0;
            updateDisplay(0);
            
            document.getElementById('icon-play').style.display = 'block';
            document.getElementById('icon-pause').style.display = 'none';
            document.getElementById('status-text').innerText = "Time's Up! 🧘‍♂️";
            document.title = "Done! - Wukong Timer";
            
            playGong();
            
            // Vibrator
            if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
        }

        // Init
        updateDisplay(duration);
    </script>
</body>
</html>
